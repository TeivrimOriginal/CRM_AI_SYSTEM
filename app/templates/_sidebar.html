<aside class="sidebar">
  <div class="brand">
    <div class="brand-logo">AI</div>
    <div>
      <div class="brand-text">AI BUSINESS</div>
      <div class="brand-sub">CRM · Denmark</div>
    </div>
  </div>
  <nav>
    <a href="/tasks" class="{% if active == 'tasks' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Мои задачи
    </a>
    <a href="/companies" class="{% if active == 'companies' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>
      Компании
    </a>
    <a href="/pipeline" class="{% if active == 'pipeline' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-6"/></svg>
      Воронка
    </a>
    <a href="/reports" class="{% if active == 'reports' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
      Отчёт
    </a>
    {% if user.role == 'supervisor' %}
    <a href="/imports" class="{% if active == 'imports' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Импорт
    </a>
    <a href="/admin" class="{% if active == 'admin' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Пользователи
    </a>
    <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Настройки
    </a>
    {% endif %}
    <a href="/profile" class="{% if active == 'profile' %}active{% endif %}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </a>
  </nav>
  <div class="side-bottom">
    <div class="side-user">
      <div class="avatar">{{ user.full_name[:1] }}</div>
      <div class="info">
        <div class="name">{{ user.full_name }}</div>
        <div class="role">{{ user.role }}</div>
      </div>
    </div>
    <div class="side-actions">
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button onclick="logout()">Выйти</button>
    </div>
  </div>
</aside>
<script>
function logout(){fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).then(()=>location.href='/login')}
</script>
