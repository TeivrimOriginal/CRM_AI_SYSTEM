<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — CRM</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f9fafb; color: #111827; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; }
    main { padding: 24px; }
    .hint { color: #6b7280; font-size: 14px; }
    button { background: #4f46e5; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  </style>
{% include "_theme.html" %}
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <div>
      <span style="margin-right:12px; color:#374151; font-size:14px;">{{ user.full_name }} ({{ user.role }})</span>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button><button onclick="logout()">Выйти</button>
    </div>
  </header>
  <main>
    <p class="hint">Это заглушка итерации 2. Здесь будет раздел «{{ title }}».</p>
  </main>
  <script>
    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/login';
    }
  </script>
</body>
</html>
