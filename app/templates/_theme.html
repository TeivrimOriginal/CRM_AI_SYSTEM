<style>
:root {
  --bg: #f5f6f8;
  --bg-alt: #eceef2;
  --card: #ffffff;
  --sidebar: #1e2235;
  --sidebar-hover: #2a2f47;
  --sidebar-active: #4f46e5;
  --sidebar-text: #a9b1c9;
  --sidebar-text-active: #ffffff;
  --text: #1a1d29;
  --text-muted: #6b7280;
  --border: #e3e6ec;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-text: #ffffff;
  --input-bg: #ffffff;
  --input-border: #d5d9e2;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow: 0 4px 12px rgba(16,24,40,.08);
  --radius: 10px;
  --radius-sm: 7px;
}
html[data-theme="dark"] {
  --bg: #0f1219;
  --bg-alt: #161a24;
  --card: #1a1f2e;
  --sidebar: #0b0e15;
  --sidebar-hover: #1a1f2e;
  --sidebar-active: #4f46e5;
  --sidebar-text: #7c8499;
  --sidebar-text-active: #ffffff;
  --text: #e6e9f0;
  --text-muted: #8b93a8;
  --border: #262c3d;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-text: #ffffff;
  --input-bg: #0f1219;
  --input-border: #2d3447;
  --success: #34d399;
  --danger: #f87171;
  --warning: #fbbf24;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 4px 12px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-hover); }
h1, h2, h3, h4 { color: var(--text); font-weight: 600; }
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px;
  background: var(--sidebar);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,.04);
}
.sidebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px 20px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  margin-bottom: 16px;
}
.sidebar .brand-logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 15px;
  flex-shrink: 0;
}
.sidebar .brand-text { font-weight: 600; color: #fff; font-size: 14px; line-height: 1.2; }
.sidebar .brand-sub { font-size: 11px; color: var(--sidebar-text); font-weight: 400; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sidebar nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--sidebar-text);
  font-size: 13.5px;
  font-weight: 500;
  transition: background .15s, color .15s;
}
.sidebar nav a:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
.sidebar nav a.active { background: var(--sidebar-active); color: #fff; }
.sidebar nav a .icon { width: 18px; height: 18px; flex-shrink: 0; opacity: .9; }
.sidebar nav a.active .icon { opacity: 1; }
.sidebar .side-bottom { border-top: 1px solid rgba(255,255,255,.06); padding-top: 12px; margin-top: 12px; }
.sidebar .side-user {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  font-size: 12.5px;
  color: var(--sidebar-text);
}
.sidebar .side-user .avatar {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #6366f1, #ec4899);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 600; font-size: 12px;
  flex-shrink: 0;
}
.sidebar .side-user .info { flex: 1; min-width: 0; }
.sidebar .side-user .info .name { color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar .side-user .info .role { font-size: 11px; color: var(--sidebar-text); text-transform: uppercase; letter-spacing: .5px; }
.sidebar .side-actions { display: flex; gap: 6px; margin-top: 10px; }
.sidebar .side-actions button {
  flex: 1; padding: 8px;
  background: var(--sidebar-hover);
  color: var(--sidebar-text);
  border: 0; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px;
  transition: background .15s;
}
.sidebar .side-actions button:hover { background: #3a4055; color: #fff; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.topbar h1 { font-size: 18px; font-weight: 600; }
.topbar .actions { display: flex; gap: 8px; align-items: center; }
.page { padding: 24px 28px; }
.card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.card h2 { font-size: 15px; margin-bottom: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.card-head h2 { margin: 0; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary); color: var(--primary-text);
  border: 0; padding: 8px 14px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background .15s, transform .05s;
}
.btn:hover { background: var(--primary-hover); }
.btn:active { transform: scale(.98); }
.btn.sec { background: var(--bg-alt); color: var(--text); }
.btn.sec:hover { background: var(--border); }
.btn.danger { background: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { background: var(--bg-alt); color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: var(--bg-alt); }
td a { font-weight: 500; }
input, select, textarea {
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px; font-size: 13.5px;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);
}
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar input, .toolbar select { min-width: 140px; }
.modal-bg {
  position: fixed; inset: 0; background: rgba(10,12,20,.55);
  display: flex; align-items: center; justify-content: center; z-index: 50;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--card); color: var(--text);
  padding: 24px; border-radius: var(--radius);
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal h2 { margin-bottom: 16px; font-size: 17px; }
.modal label { display: block; font-size: 12.5px; color: var(--text-muted); margin: 12px 0 5px; }
.modal input, .modal select, .modal textarea { width: 100%; }
.modal .row { display: flex; gap: 10px; margin-top: 20px; }
.modal .row button { flex: 1; padding: 10px; }
.muted { color: var(--text-muted); }
.err { color: var(--danger); font-size: 13px; margin-top: 10px; }
.msg { color: var(--success); font-size: 13px; margin-top: 10px; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--bg-alt); color: var(--text-muted); }
.badge.stage { background: rgba(79,70,229,.1); color: var(--primary); }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi > div { background: var(--bg-alt); border-radius: var(--radius-sm); padding: 14px; }
.kpi b { display: block; font-size: 26px; color: var(--primary); font-weight: 700; line-height: 1.2; }
.kpi span { color: var(--text-muted); font-size: 11.5px; }
.theme-toggle {
  background: var(--bg-alt); border: 0; color: var(--text);
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; transition: background .15s;
}
.theme-toggle:hover { background: var(--border); }
[x-cloak] { display: none !important; }
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; padding: 12px; }
  .sidebar nav { flex-direction: row; overflow-x: auto; gap: 4px; }
  .sidebar nav a { white-space: nowrap; padding: 8px 12px; }
  .sidebar .side-bottom { display: none; }
  .page { padding: 16px; }
  .topbar { padding: 12px 16px; }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; background: var(--card); }
  td { border: 0; padding: 5px 0; }
  td::before { content: attr(data-label) ": "; color: var(--text-muted); font-weight: 600; }
}
</style>
<script>
(function(){
  var t = localStorage.getItem('crm_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') || 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('crm_theme', next);
  document.querySelectorAll('.theme-toggle').forEach(function(b){
    b.textContent = next === 'dark' ? '☀' : '🌙';
  });
}
document.addEventListener('DOMContentLoaded', function(){
  var cur = document.documentElement.getAttribute('data-theme') || 'light';
  document.querySelectorAll('.theme-toggle').forEach(function(b){
    b.textContent = cur === 'dark' ? '☀' : '🌙';
  });
});
</script>
