<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — CRM</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
{% include "_theme.html" %}
<style>body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}.login-card{background:var(--card);padding:32px;border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:440px}.login-card h1{margin-bottom:8px;font-size:22px}.login-card p{margin-bottom:20px;color:var(--text-muted);font-size:13px}.login-card label{display:block;font-size:13px;margin:12px 0 6px}.login-card input,.login-card select{width:100%;margin-bottom:4px}.login-card button{width:100%;margin-top:20px;padding:12px;font-size:15px}.theme-wrap{position:fixed;top:16px;right:16px}</style>
</head><body>
<div class="theme-wrap"><button class="theme-toggle" onclick="toggleTheme()">🌙</button></div>
<div class="login-card" x-data="registerForm()">
<h1>Регистрация</h1>
<p>Первый пользователь = руководитель. Остальные — менеджеры.</p>
<form @submit.prevent="submit">
<label>ФИО</label><input x-model="full_name" required autofocus>
<label>Email</label><input type="email" x-model="email" required>
<label>Пароль (мин. 6)</label><input type="password" x-model="password" required minlength="6">
<label>Часовой пояс</label>
<select x-model="timezone">
<option value="Europe/Moscow">Москва (UTC+3)</option>
<option value="Europe/Kaliningrad">Калининград (UTC+2)</option>
<option value="Asia/Almaty">Алматы (UTC+6)</option>
<option value="Asia/Astana">Астана (UTC+6)</option>
<option value="Asia/Tashkent">Ташкент (UTC+5)</option>
<option value="Asia/Yerevan">Ереван (UTC+4)</option>
<option value="Asia/Bishkek">Бишкек (UTC+6)</option>
<option value="Europe/Minsk">Минск (UTC+3)</option>
<option value="UTC">UTC</option>
</select>
<button type="submit" class="btn" :disabled="loading" x-text="loading?'Создание...':'Зарегистрироваться'"></button>
<div class="err" x-show="error" x-text="error"></div>
<div style="text-align:center;margin-top:14px;font-size:14px"><a href="/login">Уже есть аккаунт? Войти</a></div>
</form></div>
<script>
function registerForm(){return{full_name:'',email:'',password:'',timezone:'Europe/Moscow',loading:false,error:'',
async submit(){this.loading=true;this.error='';try{const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:this.email,password:this.password,full_name:this.full_name,timezone:this.timezone})});if(!res.ok){const d=await res.json().catch(()=>({}));this.error=typeof d.detail==='string'?d.detail:'Ошибка';this.loading=false;return}window.location.href='/'}catch(e){this.error='Сеть недоступна';this.loading=false}}}}
</script>
</body></html>
